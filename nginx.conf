# HTTP : redirige tout vers HTTPS
server {
    listen 80;
    server_name seoalertscan.com www.seoalertscan.com;
    return 301 https://$host$request_uri;
}

# HTTPS : serveur principal
server {
    listen 443 ssl;
    http2 on;
    server_name seoalertscan.com www.seoalertscan.com;

    ssl_certificate     /etc/nginx/certs/seoalertscan.com.pem;
    ssl_certificate_key /etc/nginx/certs/seoalertscan.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
